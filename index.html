<body>
<header><div class="wrap head">

<div class="search" id="sbox"><input id="q" placeholder="ابحث عن منتج..." oninput="onSearch()" autocomplete="off"><div id="sg" class="sg"></div></div>
<nav><a href="#store">الرئيسية</a><a href="#track">طلباتي</a><a href="#terms">الشروط</a><a href="#wish">❤️ المفضلة</a><a href="#cart">🛒 العربة<b id="cc"></b></a><a id="inst" onclick="installApp()" style="display:none;cursor:pointer;background:var(--sky)">⬇ ثبّت التطبيق</a></nav>
</div></header>

<script>
/* ===== طبقة البيانات: كل التخزين هنا. لاحقاً نستبدلها بـ Supabase ===== */
let stores=[],products=[],orders=[],reviews=[],bundles=[];
const catOf=p=>p.cat||(stores.find(s=>s.id==p.storeId)||{}).cat||"أخرى";
/* عرض الخصم: السعر المُدخل = سعر العرض. السعر العادي = السعر ÷ 0.7 (فيكون الخصم 30% فعلاً) */
const offerOn=p=>!!p.disc&&p.offerEnd>Date.now();
const pReg=p=>Math.round(p.price/(1-(p.dp||30)/100));
const pNow=p=>p.disc&&!offerOn(p)?pReg(p):p.price;
const cdText=end=>{const t=Math.max(0,end-Date.now());return[Math.floor(t/36e5),Math.floor(t%36e5/6e4),Math.floor(t%6e4/1e3)].map(x=>String(x).padStart(2,"0")).join(":")};
const priceHtml=p=>offerOn(p)?`<div class="pr"><s class="old">${money(pReg(p))}</s> ${money(p.price)}</div><div class="cd">⏳ ينتهي خلال <b data-end="${p.offerEnd}">${cdText(p.offerEnd)}</b></div>`:`<div class="pr">${money(pNow(p))}</div>`;
const adminPrice=p=>offerOn(p)?`${money(p.price)} <span class="pill o">عرض</span>`:money(pNow(p));
setInterval(()=>{document.querySelectorAll("[data-end]").forEach(e=>{const end=+e.dataset.end;if(end<=Date.now()){if(!e.dataset.done){e.dataset.done=1;setTimeout(route,400)}return}e.textContent=cdText(end)})},1000);
function hintD(){const n=$("ph2");if(!n)return;const v=+$("pp").value;n.style.display=$("pd").checked&&v>0?"block":"none";if(v>0)n.textContent=`سيظهر للعميل ${money(v)} بدلاً من ${money(Math.round(v/0.7))} (خصم 30%)، وبعد 24 ساعة يرجع السعر ${money(Math.round(v/0.7))}.`}
let cfg={fee:50,vf:"",ip:"",policy:"",wa:"",waMsg:"",ig:"",fb:"",tt:"",siteUrl:""};
const save=()=>{sync()};
const ST=["بانتظار الدفع","بانتظار المراجعة","مدفوع ومؤكد","أُرسل للمتجر","ملغي"];
const PAID=["مدفوع ومؤكد","أُرسل للمتجر"];ST.push("تم التسليم");PAID.push("تم التسليم");
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=n=>Number(n).toLocaleString("en-US")+" جنيه";
const sName=id=>(stores.find(s=>s.id==id)||{name:"—"}).name;
const nid=a=>a.reduce((m,x)=>Math.max(m,x.id),0)+1;
const $=id=>document.getElementById(id);
function openM(h){$("modal").innerHTML=h;$("ov").classList.add("show")}
function closeM(){$("ov").classList.remove("show")}
$("ov").addEventListener("click",e=>{if(e.target.id==="ov")closeM()});

/* ===== التوجيه ===== */
let cat="الكل",tab="dash",authed=false,sel=null;

function route(){
 const h=location.hash.slice(1)||"store";
 $("sbox").style.visibility=h==="store"?"visible":"hidden";
 if(h===ADM)renderAdmin();else if(h==="cart")renderCart();else if(h==="wish")renderWish();else if(PGS[h])renderPage(h);else if(h.startsWith("p-"))renderProd(+h.slice(2));else if(h==="track")renderTrack();else if(h==="terms")renderTerms();else renderStore();
 window.scrollTo(0,0);renderFoot();renderWA();fillBundles();
}
window.addEventListener("hashchange",route);

/* ===== الموقع ===== */
function renderStore0(){
 const app=$("app"),q=($("q")||{value:""}).value.trim().toLowerCase();
 const act=products.filter(p=>p.active);
 const cats=["الكل",...new Set(act.map(catOf))];
 const shown=act.filter(p=>(cat==="الكل"||catOf(p)===cat)&&(p.name.toLowerCase().includes(q)||catOf(p).toLowerCase().includes(q)));
 if(!document.getElementById("grid")){
  app.innerHTML=`<section class="hero"><div style="color:#b9dcff;font-size:13px;font-weight:700">EVERYTHING. ONE PLACE.</div><h1>اكتشف أكثر.. تسوّق أسهل</h1><p>منتجات متنوعة في مكان واحد. اختر منتجك وادفع عربون جدية الحجز ${cfg.fee} جنيه، وبعد تأكيد الدفع نتواصل معك لإتمام الطلب والتوصيل.</p><button class="btn" onclick="document.getElementById('grid').scrollIntoView({behavior:'smooth'})">تصفح المنتجات</button></section>
  <div class="trust"><div><b>عربون جدية حجز</b>${cfg.fee} جنيه فقط لتأكيد طلبك</div><div><b>تأكيد قبل التجهيز</b>لا يبدأ تجهيز طلبك قبل تأكيد الدفع</div><div><b>تواصل مباشر</b>نتواصل معك لإتمام الطلب والتوصيل</div></div>
  <div id="bnd"></div><div id="rails"></div><div class="cats" id="cats"></div><div class="fbar"><select onchange="sortBy=this.value;applyView()"><option value="new">الأحدث</option><option value="low">الأرخص</option><option value="high">الأغلى</option><option value="rate">الأعلى تقييماً</option><option value="disc">الأعلى خصماً</option></select><label class="chk" style="margin:0"><input type="checkbox" onchange="offOnly=this.checked;applyView()"><span>عروض فقط</span></label><input type="number" inputmode="numeric" placeholder="أقصى سعر" style="width:110px" oninput="maxP=+this.value||0;applyView()"></div><div class="grid" id="grid"></div>`;
